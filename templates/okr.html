<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="css/stats.css">
</head>
<body>
    <div class="container">
        <h1>{{ title }}</h1>

        <div class="stats-grid">
            <div class="card" style="grid-column: 1 / -1;">
                <h2>{{ chart_title }}</h2>
                <div class="chart-container"
                     id="okr-chart"
                     style="min-height: 400px;"
                     data-labels='{{ chart_labels | tojson }}'
                     data-datasets='{{ chart_datasets | tojson }}'>
                    <canvas id="okr-chart-canvas"></canvas>
                </div>
            </div>

            <div class="card" style="grid-column: 1 / -1;">
                <h2>Key Results</h2>
                <table class="stats-table">
                    <thead>
                        <tr>
                            <th>Key Result</th>
                            <th style="text-align: right">Target</th>
                            <th style="text-align: right">Current</th>
                            <th style="text-align: right">Progress</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for kr in key_results %}
                        <tr>
                            <td class="period">{{ kr.name }}</td>
                            <td class="value">{{ kr.target }}</td>
                            <td class="value">{{ kr.current }}</td>
                            <td class="value{% if kr.progress >= 70 %} trend-positive{% elif kr.progress >= 40 %} trend-neutral{% else %} trend-negative{% endif %}">{{ kr.progress }}%</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>

        <div class="footer">
            <p>Generated by <a href="https://github.com/BenjaminKobjolke/quantify-your-life">Quantify Your Life</a> on {{ generated_at }}</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="js/okr_chart.js"></script>
</body>
</html>
